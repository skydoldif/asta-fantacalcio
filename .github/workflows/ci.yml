name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Il Postgres di prova: senza, i test del repository girano solo in
    # memoria e il SQL che gira la sera dell'asta resterebbe non verificato.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASTA_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formattazione
        run: ruff format --check .

      - name: Tipi (dominio)
        run: mypy

      - name: Test
        run: pytest --cov=asta --cov-report=term-missing
